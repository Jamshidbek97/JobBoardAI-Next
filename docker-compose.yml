services:
  job-board-ai-next:
    container_name: job-board-ai-next
    restart: always
    image: node:20.11.0
    ports: 
      - 4000:3000
    environment:
      - PORT=3000
      - NEXT_PUBLIC_API_URL=http://localhost:4001
      - NEXT_PUBLIC_GRAPHQL_URL=http://localhost:4001/graphql
      - NEXT_PUBLIC_WS_URL=ws://localhost:4001
    volumes:
      - ./:/usr/src/jobBoardAi-next
    working_dir: /usr/src/jobBoardAi-next
    network_mode: host

    command: bash -c "yarn install && yarn build && yarn run start"
